[tool.poetry]
name = "api-inference"
version = "0.1.0"
description = "FastAPI microservice for machine learning model inference"
authors = ["Vadim [vadimprotopopov12345@gmail.com](mailto:vadimprotopopov12345@gmail.com)"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
numpy = "^1.24.0"
pandas = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
"."
]
