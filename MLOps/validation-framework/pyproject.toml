[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validation-framework"
version = "0.1.0"
authors = [{name = "Vadim"}]
description = "Validation framework for ML models"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "experiment-tracker"
]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
include = ["val_framework*"]