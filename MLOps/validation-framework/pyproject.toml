[tool.poetry]
name = "validation-framework"
version = "0.1.0"
description = "Custom machine learning validation framework"
authors = ["Vadim <vadimprotopopov12345@gmail.com>"]
readme = "README.md"
packages = [{ include = "val_framework", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24.0"
pandas = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
    "src"
]