[tool.poetry]
name = "experiment-tracker"
version = "0.1.0"
description = "A lightweight ML experiment tracker with SQLite backend"
authors = ["Vadim <vadimprotopopov12345@gmail.com>"]
readme = "README.md"
packages = [{include = "experiment_tracker", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = "^0.12.0"
tabulate = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
